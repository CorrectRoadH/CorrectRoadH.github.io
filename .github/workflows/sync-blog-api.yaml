name: Sync Blog via API

on:
  push:
    branches: [ blog ]
  workflow_dispatch: # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read

    # 确保这个 action 只在你的仓库运行
    if: github.repository == 'CorrectRoadH/Blog'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 'blog'
          fetch-depth: 0

      - name: Create sync branch in target repository
        env:
          GITHUB_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          # 创建带时间戳的分支名
          BRANCH_NAME="sync-from-blog-$(date +%Y%m%d%H%M%S)"
          
          # 使用 GitHub API 创建分支
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/CorrectRoadH/CorrectRoadH.github.io/git/refs" \
            -d '{
              "ref": "refs/heads/'$BRANCH_NAME'",
              "sha": "'$(git rev-parse HEAD)'"
            }'
          
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Upload files to target repository
        env:
          GITHUB_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          # 创建临时目录
          mkdir -p temp_sync
          
          # 复制所有文件（除了 .git 和当前工作流文件）
          rsync -av --exclude='.git' --exclude='.github/workflows/sync-blog-api.yaml' ./ temp_sync/
          
          # 进入临时目录
          cd temp_sync
          
          # 为每个文件创建或更新
          find . -type f | while read file; do
            # 跳过临时目录
            if [[ "$file" == "./temp_sync"* ]]; then
              continue
            fi
            
            # 获取文件内容（base64编码）
            CONTENT=$(base64 -w 0 "$file")
            
            # 检查文件是否已存在
            FILE_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/CorrectRoadH/CorrectRoadH.github.io/contents/$file?ref=$BRANCH_NAME")
            
            if [ "$FILE_EXISTS" = "200" ]; then
              # 文件存在，更新它
              echo "Updating file: $file"
              curl -X PUT \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/CorrectRoadH/CorrectRoadH.github.io/contents/$file" \
                -d '{
                  "message": "chore: Sync file from Blog repository",
                  "content": "'$CONTENT'",
                  "branch": "'$BRANCH_NAME'"
                }'
            else
              # 文件不存在，创建它
              echo "Creating file: $file"
              curl -X PUT \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/CorrectRoadH/CorrectRoadH.github.io/contents/$file" \
                -d '{
                  "message": "chore: Add file from Blog repository",
                  "content": "'$CONTENT'",
                  "branch": "'$BRANCH_NAME'"
                }'
            fi
          done
          
          # 清理临时目录
          cd ..
          rm -rf temp_sync

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          # 创建 PR
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/CorrectRoadH/CorrectRoadH.github.io/pulls" \
            -d '{
              "title": "chore: Sync from Blog repository",
              "body": "This PR syncs the latest changes from the Blog repository. Please review and merge.",
              "head": "'$BRANCH_NAME'",
              "base": "blog"
            }'
          
          echo "Pull request created successfully!"
