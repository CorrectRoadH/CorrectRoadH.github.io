name: Sync Blog

on:
  push:
    branches: [ blog ]
  workflow_dispatch: # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read

    # 确保这个 action 只在你的仓库运行，而不是在上游仓库
    if: github.repository == 'CorrectRoadH/Blog'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 你的主要分支
          ref: 'blog'

      - name: Setup SSH
        run: |
            # 创建 SSH 目录
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            
            # 解码并保存私钥
            echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            
            # 添加 GitHub 到已知主机
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            
            # 启动 SSH 代理并添加密钥
            eval "$(ssh-agent -s)"
            ssh-add ~/.ssh/id_rsa

      - name: Push to destination repo
        run: |
            # 配置 git
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            
            # 添加目标仓库为远程仓库（使用 SSH）
            git remote add destination git@github.com:CorrectRoadH/CorrectRoadH.github.io.git
            
            # 推送到一个新的分支名，避免历史冲突
            git push destination blog:blog-sync --force
            
            # 删除旧的blog分支（如果存在）
            git push destination --delete blog || true
            
            # 将新分支重命名为blog
            git push destination blog-sync:blog --force
            
            # 删除临时分支
            git push destination --delete blog-sync || true
