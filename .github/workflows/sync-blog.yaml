name: Sync Blog

on:
  push:
    branches: [ blog ]
  workflow_dispatch: # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read

    # 确保这个 action 只在你的仓库运行，而不是在上游仓库
    if: github.repository == 'CorrectRoadH/Blog'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 你的主要分支
          ref: 'blog'

      - name: Push to destination repo
        run: |
            # 配置 git
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            
            # 添加目标仓库为远程仓库
            git remote add destination https://${{ secrets.TARGET_REPO_TOKEN }}@github.com/CorrectRoadH/CorrectRoadH.github.io.git
            
            # 推送到目标仓库
            git push destination main --force
