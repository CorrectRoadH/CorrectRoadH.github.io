name: Build and Deploy

on:
  push:
    branches:
      - blog

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Trigger deployment
        run: |
          curl -s --connect-timeout 5 "http://blog-webhook.blog.svc.cluster.local" \
            || echo "Deployment webhook triggered or not available"
